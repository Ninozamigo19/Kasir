{% extends "Sidebar.html" %}

{% block title %}
Transaksi
{% endblock %}

{% block body1 %}
<body class="bg-gray-100 p-4 min-h-screen">
    <div class="container mx-auto flex">
        <!-- Bagian kiri (search box dan daftar barang) -->
        <div class="w-2/3 bg-white p-4 rounded shadow h-full">
            <!-- Search Box -->
            <div class="mb-4">
                <input
                    type="text"
                    id="search-box"
                    placeholder="Search box"
                    class="w-full p-2 border border-gray-300 rounded"
                    oninput="filterTabel()"
                />
            </div>

            <!-- Tabel daftar barang -->
            <table class="w-full border-collapse border border-gray-300">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="border border-gray-300 p-2">ID</th>
                        <th class="border border-gray-300 p-2">Nama Barang</th>
                        <th class="border border-gray-300 p-2">Harga</th>
                        <th class="border border-gray-300 p-2">Stok</th>
                        <th class="border border-gray-300 p-2">Aksi</th>
                    </tr>
                </thead>
                <tbody id="daftar-barang">
                    {% for produk in produk_list %}
                    <tr data-product-id="{{ produk[0] }}">
                        <td class="border border-gray-300 p-2">{{ produk[0] }}</td>
                        <td class="border border-gray-300 p-2">{{ produk[1] }}</td>
                        <td class="border border-gray-300 p-2">Rp.{{ produk[2] }}</td>
                        <td class="border border-gray-300 p-2">{{ produk[3] }}</td>
                        <td class="border border-gray-300 p-2">
                            <button
                                class="bg-blue-500 text-white px-4 py-1 rounded hover:bg-blue-600"
                                onclick="tambahKeKeranjang(this)"
                            >
                                Tambah
                            </button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Bagian kanan (keranjang dan form pembayaran) -->
        <div class="w-full lg:w-1/3 bg-gray-50 p-6 rounded shadow">
            <!-- Keranjang Barang -->
            <h2 class="text-lg font-bold mb-4 text-gray-700">Keranjang</h2>
            <div class="overflow-auto max-h-64 mb-6">
                <table class="w-full border-collapse border border-gray-300">
                    <thead>
                        <tr class="bg-gray-200 sticky top-0">
                            <th class="border border-gray-300 p-2 text-left">Nama Barang</th>
                            <th class="border border-gray-300 p-2 text-left">Harga</th>
                            <th class="border border-gray-300 p-2 text-left">Jumlah</th>
                        </tr>
                    </thead>
                    <tbody id="keranjang-barang" class="bg-white overflow-y-auto max-h-5">
                        <!-- Baris barang akan ditambahkan di sini -->
                    </tbody>
                </table>
            </div>

            <!-- Form Pembayaran -->
            <form id="form-transaksi">
                <div class="mb-4">
                    <label for="pelangganid" class="block font-bold text-gray-700 mb-1">Pilih Pelanggan</label>
                    <select
                        name="pelangganid"
                        id="pelangganid"
                        class="w-full p-2 border border-gray-300 rounded focus:outline-blue-400"
                    >
                        <option value="">-- Pilih Pelanggan --</option>
                        {% for pelanggan in pelanggan_list %}
                        <option value="{{ pelanggan[0] }}">{{ pelanggan[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label for="userid" class="block font-bold text-gray-700 mb-1">Pilih Pengguna</label>
                    <select
                        name="userid"
                        id="userid"
                        class="w-full p-2 border border-gray-300 rounded focus:outline-blue-400"
                        required
                    >
                        <option value="">-- Pilih Pengguna --</option>
                        {% for pengguna in pengguna_list %}
                        <option value="{{ pengguna[0] }}">{{ pengguna[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label for="subtotal" class="block font-bold text-gray-700 mb-1">SubTotal</label>
                    <input
                        type="text"
                        id="subtotal"
                        name="totalharga"
                        placeholder="SubTotal"
                        class="w-full p-2 border border-gray-300 rounded bg-gray-100"
                        readonly
                    />
                </div>

                <div class="mb-4">
                    <label for="uang-diterima" class="block font-bold text-gray-700 mb-1">Uang Diterima</label>
                    <input
                        type="number"
                        id="uang-diterima"
                        placeholder="Masukkan uang diterima"
                        class="w-full p-2 border border-gray-300 rounded focus:outline-blue-400"
                        oninput="hitungKembalian()"
                    />
                </div>

                <div class="mb-4">
                    <label for="kembalian" class="block font-bold text-gray-700 mb-1">Kembalian</label>
                    <input
                        type="text"
                        id="kembalian"
                        placeholder="Kembalian"
                        class="w-full p-2 border border-gray-300 rounded bg-gray-100"
                        readonly
                    />
                </div>

                <!-- Tombol Bayar -->
                <button
                    type="submit"
                    class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded hover:bg-blue-600"
                >
                    Bayar
                </button>
            </form>
        </div>
    </div>

    <script>
        // Fungsi untuk menambahkan barang ke keranjang
        function tambahKeKeranjang(button) {
            const row = button.parentElement.parentElement;
            const produkId = row.dataset.productId; // Ambil ID produk dari data attribute
            const namaBarang = row.cells[1].textContent; // Ambil nama barang dari kolom kedua
            const hargaBarang = parseFloat(row.cells[2].textContent.replace("Rp.", "").replace(",", "")); // Ambil harga barang dari kolom ketiga
            const stokCell = row.cells[3]; // Ambil sel stok
            let stok = parseInt(stokCell.textContent); // Ambil nilai stok

            if (stok > 0) {
                stok -= 1; // Kurangi stok
                stokCell.textContent = stok; // Perbarui tampilan stok
                updateKeranjang(produkId, namaBarang, hargaBarang);
                updateSubtotal();
            } else {
                alert("Stok barang tidak mencukupi.");
            }
        }

        // Fungsi untuk memperbarui keranjang
        function updateKeranjang(produkId, namaBarang, hargaBarang) {
            const keranjang = document.getElementById("keranjang-barang");
            const rows = keranjang.getElementsByTagName("tr");
            let barangDitemukan = false;

            for (let i = 0; i < rows.length; i++) {
                if (rows[i].dataset.productId === produkId) {
                    const jumlahCell = rows[i].cells[2];
                    jumlahCell.textContent = parseInt(jumlahCell.textContent) + 1;
                    barangDitemukan = true;
                    break;
                }
            }

            if (!barangDitemukan) {
                const newRow = document.createElement("tr");
                newRow.dataset.productId = produkId;
                newRow.innerHTML = `
                    <td class="border border-gray-300 p-2">${namaBarang}</td>
                    <td class="border border-gray-300 p-2">Rp.${hargaBarang.toLocaleString("id-ID")}</td>
                    <td class="border border-gray-300 p-2">1</td>
                `;
                keranjang.appendChild(newRow);
            }
        }

        // Fungsi untuk menghitung subtotal
        function updateSubtotal() {
            const keranjang = document.getElementById("keranjang-barang").getElementsByTagName("tr");
            let subtotal = new Decimal(0);
            for (let i = 0; i < keranjang.length; i++) {
                const harga = new Decimal(keranjang[i].cells[1].textContent.replace("Rp.", "").replace(",", ""));
                const jumlah = parseInt(keranjang[i].cells[2].textContent, 10);
                subtotal = subtotal.plus(harga.times(jumlah));
            }
            document.getElementById("subtotal").value = subtotal.toFixed(6);
        }

        // Fungsi untuk menghitung kembalian
        function hitungKembalian() {
            const subtotal = new Decimal(document.getElementById("subtotal").value.replace(",", "") || 0);
            const uangDiterima = new Decimal(document.getElementById("uang-diterima").value || 0);
            const kembalian = uangDiterima.minus(subtotal);
            document.getElementById("kembalian").value = kembalian.greaterThanOrEqualTo(0) ? kembalian.toFixed(6) : '';
        }

        // Fungsi untuk filter tabel
        function filterTabel() {
            const searchValue = document.getElementById("search-box").value.toLowerCase();
            const rows = document.getElementById("daftar-barang").getElementsByTagName("tr");

            for (let i = 0; i < rows.length; i++) {
                const namaBarang = rows[i].cells[1].textContent.toLowerCase();
                rows[i].style.display = namaBarang.includes(searchValue) ? "" : "none";
            }
        }

        // Fungsi untuk mengirim data transaksi menggunakan fetch dengan Content-Type JSON
        document.getElementById('form-transaksi').addEventListener('submit', function(event) {
            event.preventDefault();

            const pelangganId = document.getElementById("pelangganid").value;
            const userId = document.getElementById("userid").value;

            const keranjang = document.getElementById("keranjang-barang").getElementsByTagName("tr");
            const items = [];

            for (let i = 0; i < keranjang.length; i++) {
                const productId = keranjang[i].dataset.productId;
                const namaBarang = keranjang[i].cells[0].textContent;
                const harga = parseFloat(keranjang[i].cells[1].textContent.replace("Rp.", "").replace(",", ""));
                const jumlah = parseInt(keranjang[i].cells[2].textContent, 10);
                items.push({ productId, namaBarang, harga, jumlah });
            }

            fetch("{{ url_for('jual') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    pelangganId,
                    userId,
                    items
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    alert(data.message);
                    // Reset keranjang & form
                    document.getElementById("keranjang-barang").innerHTML = '';
                    document.getElementById("subtotal").value = '0.000000';
                    document.getElementById("uang-diterima").value = '';
                    document.getElementById("kembalian").value = '';
                }
            })
            .catch(error => console.error("Error:", error));
        });
    </script>
</body>
{% endblock %}
